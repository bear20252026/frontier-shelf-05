<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - glTF + transmission</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - glTF + transmission">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_loader_gltf_transmission.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_loader_gltf_transmission.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			

			<div class="title-wrapper">
				three.js<span>glTF + Transmission</span>
			</div>

			<small>
				KHR_materials_transmission Iridescent Dish With Olives by Eric Chadwick<br />
				Royal Esplanade from HDRI Haven
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { UltraHDRLoader } from 'three/addons/loaders/UltraHDRLoader.js';

			import { DRACOLoader, DRACO_GLTF_CONFIG } from 'three/addons/loaders/DRACOLoader.js';

			let camera, scene, renderer, controls, timer, mixer;

			init();

			function init() {

				timer = new THREE.Timer();
				timer.connect( document );

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 20 );
				camera.position.set( 0, 0.4, 0.7 );

				scene = new THREE.Scene();

				new UltraHDRLoader()
					.setPath( 'textures/equirectangular/' )
					.load( 'royal_esplanade_2k.hdr.jpg', function ( texture ) {

						texture.mapping = THREE.EquirectangularReflectionMapping;

						scene.background = texture;
						scene.backgroundBlurriness = 0.35;

						scene.environment = texture;

						// model

						new GLTFLoader()
							.setPath( 'models/gltf/' )
							.setDRACOLoader( new DRACOLoader().setDecoderPath( DRACO_GLTF_CONFIG ) )
							.load( 'IridescentDishWithOlives.glb', function ( gltf ) {

								mixer = new THREE.AnimationMixer( gltf.scene );
								mixer.clipAction( gltf.animations[ 0 ] ).play();

								scene.add( gltf.scene );

							} );

					} );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setAnimationLoop( render );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1;
				container.appendChild( renderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.autoRotate = true;
				controls.autoRotateSpeed = - 0.75;
				controls.enableDamping = true;
				controls.minDistance = 0.5;
				controls.maxDistance = 1;
				controls.target.set( 0, 0.1, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function render() {

				timer.update();

				if ( mixer ) mixer.update( timer.getDelta() );

				controls.update();

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
